# Per-app static SPA server (used inside deploy/Dockerfile.web).
# TLS terminates at the edge (Cloudflare + edge nginx); this listens on :8080.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (edge may add more; these are defence-in-depth).
  #
  # Content-Security-Policy: the sessions live in localStorage, so the one
  # thing that must never run is injected script. script-src allows only our
  # own bundle (and Razorpay Checkout, which the resident app loads to take
  # payments). __API_ORIGIN__ is filled in at image build time from
  # VITE_API_BASE_URL (see deploy/Dockerfile.web). 'unsafe-inline' is for
  # STYLES only (UI libraries inject <style>); it does not permit script.
  # nginx does not inherit add_header into a location that sets its own, so
  # the shared headers live in an include and every location pulls it in.
  include /etc/nginx/conf.d/security-headers.inc;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # Hashed, immutable assets — cache hard.
  location /assets/ {
    expires 1y;
    include /etc/nginx/conf.d/security-headers.inc; add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # PWA runtime files must never be cached stale (so updates land immediately).
  location = /sw.js            { include /etc/nginx/conf.d/security-headers.inc; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /registerSW.js    { include /etc/nginx/conf.d/security-headers.inc; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { include /etc/nginx/conf.d/security-headers.inc; add_header Cache-Control "no-cache"; try_files $uri =404; }

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 'ok'; }

  # SPA fallback — client-side routing.
  location / {
    include /etc/nginx/conf.d/security-headers.inc; add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
