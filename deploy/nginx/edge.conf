# Living edge reverse proxy. TLS terminates at Cloudflare (Full/Strict); this
# origin listens on :80 behind it (or add certs + listen 443 for direct TLS).
# Replace *.living.example with your domains. Routes:
#   admin.*  → portal      app.*   → resident      gate.*  → workforce
#   api.*    → API (Nest)  files.* → MinIO (signed upload/download links only)
#
# The real client IP is recovered from Cloudflare in cloudflare-realip.conf,
# so $remote_addr below is the person, not a Cloudflare edge.
#
# Rate limiting is a coarse edge backstop; the API's throttler is the real one.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Shared proxy + security headers.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# OVERWRITE (don't append to) X-Forwarded-For with the address we trust, so the
# API (TRUST_PROXY=1) reads exactly one hop and nothing a client sent.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;

server_tokens off;

upstream living_api      { server api:4000; }
upstream living_portal   { server portal:8080; }
upstream living_resident { server resident:8080; }
upstream living_workforce{ server workforce:8080; }
upstream living_files    { server minio:9000; }

# ── API ──
server {
  listen 80;
  server_name api.living.example;
  client_max_body_size 12m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # Browsers honour HSTS only over HTTPS — i.e. as relayed by Cloudflare.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/v1/health { proxy_pass http://living_api; access_log off; }

  # Process metrics are for the internal scraper only — never the internet.
  location /api/v1/metrics { return 404; }

  # Server-sent events (Gate Management realtime).
  #
  # `proxy_buffering` defaults to ON, which holds events in nginx's buffer until
  # it fills — the stream looks completely dead in production while working
  # perfectly in dev. gzip buffers for the same reason. The long read timeout
  # is what lets a connection idle between events; the API also sends a 25s
  # heartbeat, so this is belt and braces.
  location /api/v1/realtime/ {
    proxy_pass http://living_api;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location / {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://living_api;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# ── Files (MinIO) ──
# Serves ONLY requests carrying a valid signature the API minted (the bucket is
# private; MinIO rejects anything unsigned). Set MINIO_PUBLIC_ENDPOINT to
# https://files.<domain> so links are signed for this host. The MinIO console
# is never routed here.
server {
  listen 80;
  server_name files.living.example;
  # Matches STORAGE_MAX_UPLOAD_MB (+ headroom); the API also re-checks size.
  client_max_body_size 30m;

  location / {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://living_files;
    proxy_request_buffering off;
    proxy_buffering off;
    # Uploaded files are user content: never let one run as a page.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "script-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
}

# ── Admin portal ──
server { listen 80; server_name admin.living.example;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location / { proxy_pass http://living_portal; } }

# ── Resident PWA ──
server { listen 80; server_name app.living.example;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location / { proxy_pass http://living_resident; } }

# ── Workforce PWA ──
server { listen 80; server_name gate.living.example;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location / { proxy_pass http://living_workforce; } }
